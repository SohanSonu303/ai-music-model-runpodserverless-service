<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RunPod Music AI Tester</title>
    <style>
        :root {
            --primary: #6366f1;
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            padding: 2rem;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card);
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
        }
        h1 { margin-top: 0; color: var(--primary); }
        .group { margin-bottom: 1.5rem; }
        label { display: block; margin-bottom: 0.5rem; font-size: 0.875rem; opacity: 0.8; }
        input, textarea {
            width: 100%;
            padding: 0.75rem;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 0.5rem;
            color: white;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 1rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 0.5rem;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        #status {
            margin-top: 1rem;
            padding: 1rem;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            display: none;
        }
        .info { background: #1e293b; border: 1px solid var(--primary); }
        .error { background: #451a1a; border: 1px solid #ef4444; }
        #audio-container { margin-top: 2rem; text-align: center; display: none; }
        audio { width: 100%; }
    </style>
</head>
<body>

<div class="container">
    <h1>Music AI Tester</h1>
    
    <div class="group">
        <label>RunPod API Key</label>
        <input type="password" id="apiKey" placeholder="rpa_xxxxxxxxxxxx">
    </div>

    <div class="group">
        <label>Endpoint ID</label>
        <input type="text" id="endpointId" placeholder="abc123xyz">
    </div>

    <div class="group">
        <label>API Secret (your code's ENV var)</label>
        <input type="password" id="apiSecret" placeholder="Enter the secret you set on RunPod">
    </div>

    <hr style="border: 0; border-top: 1px solid #334155; margin: 2rem 0;">

    <div class="group">
        <label>Prompt</label>
        <textarea id="prompt" rows="3">lofi hip hop, calm piano, chill beats</textarea>
    </div>

    <div class="group">
        <label>Duration (seconds)</label>
        <input type="number" id="duration" value="15">
    </div>

    <button id="generateBtn">Generate Music</button>

    <div id="status"></div>

    <div id="audio-container">
        <label>Result:</label>
        <audio id="audioPlayer" controls></audio>
        <p><a id="downloadLink" href="#" download="music.wav" style="color: var(--primary); font-size: 0.875rem;">Download WAV</a></p>
    </div>
</div>

<script>
    const btn = document.getElementById('generateBtn');
    const status = document.getElementById('status');
    const audioContainer = document.getElementById('audio-container');
    const player = document.getElementById('audioPlayer');
    const downloadLink = document.getElementById('downloadLink');

    btn.onclick = async () => {
        const apiKey = document.getElementById('apiKey').value;
        const endpointId = document.getElementById('endpointId').value;
        const apiSecret = document.getElementById('apiSecret').value;
        const prompt = document.getElementById('prompt').value;
        const duration = document.getElementById('duration').value;

        if (!apiKey || !endpointId) {
            alert('Please enter your API Key and Endpoint ID');
            return;
        }

        btn.disabled = true;
        btn.innerText = 'Generating (this may take 1-2 mins for cold start)...';
        status.style.display = 'block';
        status.className = 'info';
        status.innerText = 'Sending request to RunPod...';
        audioContainer.style.display = 'none';

        try {
            const response = await fetch(`https://api.runpod.io/v2/${endpointId}/runsync`, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${apiKey}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    headers: {
                        'Authorization': `Bearer ${apiSecret}`
                    },
                    input: {
                        prompt: prompt,
                        duration: parseInt(duration),
                        instrumental: true
                    }
                })
            });

            const data = await response.json();

            if (data.status === 'COMPLETED' && data.output && data.output.audio_base64) {
                const blob = b64toBlob(data.output.audio_base64, 'audio/wav');
                const url = URL.createObjectURL(blob);
                
                player.src = url;
                downloadLink.href = url;
                audioContainer.style.display = 'block';
                status.innerText = 'Success! Enjoy your music.';
            } else {
                throw new Error(data.error || data.status || 'Generation failed');
            }

        } catch (err) {
            console.error(err);
            status.className = 'error';
            status.innerText = 'Error: ' + err.message;
        } finally {
            btn.disabled = false;
            btn.innerText = 'Generate Music';
        }
    };

    function b64toBlob(b64Data, contentType = '', sliceSize = 512) {
        const byteCharacters = atob(b64Data);
        const byteArrays = [];
        for (let offset = 0; offset < byteCharacters.length; offset += sliceSize) {
            const slice = byteCharacters.slice(offset, offset + sliceSize);
            const byteNumbers = new Array(slice.length);
            for (let i = 0; i < slice.length; i++) {
                byteNumbers[i] = slice.charCodeAt(i);
            }
            const byteArray = new Uint8Array(byteNumbers);
            byteArrays.push(byteArray);
        }
        return new Blob(byteArrays, {type: contentType});
    }
</script>

</body>
</html>
